name: Self-Hosted Pipeline

on:
  workflow_dispatch:

jobs:
  local-run:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Environment check
        run: |
          Write-Host "Checking Python version and paths..."
          python --version
          Get-Command python | Select-Object -Property Source
          New-Item -ItemType Directory -Force -Path artifacts/local_check
          python -m compileall src/ | Out-File -FilePath artifacts/local_check/status.txt

      - name: Run local data load test
        run: |
          Write-Host "Running script with local dependencies..."
          python src/get_data.py | Add-Content -Path artifacts/local_check/status.txt

      - name: Upload local report
        uses: actions/upload-artifact@v4
        with:
          name: local-validation-results
          path: artifacts/local_check/
