name: Self-Hosted Pipeline

on:
  workflow_dispatch:

jobs:
  local-run:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    env:
      VENV_PYTHON: "D:/SSHI/open-data-ai-analytics/.venv/Scripts/python.exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          Write-Host "Installing dependencies using local venv..."
          & $env:VENV_PYTHON -m pip install --upgrade pip
          & $env:VENV_PYTHON -m pip install -r requirements.txt

      - name: Environment check
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/local_check
          & $env:VENV_PYTHON --version | Out-File -FilePath artifacts/local_check/status.txt
          & $env:VENV_PYTHON -m compileall src data_load data_quality_analysis data_research visualization web | Add-Content -Path artifacts/local_check/status.txt

      - name: Upload local report
        uses: actions/upload-artifact@v4
        with:
          name: local-validation-results
          path: artifacts/local_check/
