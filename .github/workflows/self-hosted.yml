name: Self-Hosted Pipeline

on:
  workflow_dispatch:

jobs:
  local-run:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    env:
      VENV_PYTHON: "D:/SSHI/open-data-ai-analytics/.venv/Scripts/python.exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          Write-Host "Installing dependencies using local venv..."
          # Using '&' to execute the specific python.exe path
          & $env:VENV_PYTHON -m pip install --upgrade pip
          & $env:VENV_PYTHON -m pip install -r requirements.txt

      - name: Environment check
        run: |
          Write-Host "Running on Roman's local machine using Python 3.13 venv"
          & $env:VENV_PYTHON --version
          New-Item -ItemType Directory -Force -Path artifacts/local_check
          & $env:VENV_PYTHON -m compileall src/ | Out-File -FilePath artifacts/local_check/status.txt

      - name: Run local data load test
        run: |
          Write-Host "Testing data load module locally..."
          & $env:VENV_PYTHON src/get_data.py | Add-Content -Path artifacts/local_check/status.txt

      - name: Upload local report
        uses: actions/upload-artifact@v4
        with:
          name: local-validation-results
          path: artifacts/local_check/
