#cloud-config
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-plugin
  - git

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ${admin_username}
  - mkdir -p ${repository_clone_path}
  - chown -R ${admin_username}:${admin_username} ${repository_clone_path}
  - sudo -u ${admin_username} test -d ${repository_clone_path}/.git || sudo -u ${admin_username} git clone ${repository_url} ${repository_clone_path}
  - chown -R ${admin_username}:${admin_username} ${repository_clone_path}
  - |
    cat > ${repository_clone_path}/.env <<EOF
    DATA_DIR=${data_dir}
    RAW_DATA_DIR=${raw_data_dir}
    REPORTS_DIR=${reports_dir}
    PLOTS_DIR=${plots_dir}
    RUNTIME_DIR=${runtime_dir}
    DATABASE_PATH=${database_path}
    CSV_NAME=${csv_name}
    DOWNLOAD_IF_MISSING=${download_if_missing}
    WEB_HOST=${web_host}
    WEB_PORT=${web_port}
    DB_WAIT_TIMEOUT_SECONDS=${db_wait_timeout_seconds}
    SAMPLE_PLOT_ROWS=${sample_plot_rows}
    EOF
  - chown ${admin_username}:${admin_username} ${repository_clone_path}/.env
  - sudo -u ${admin_username} bash -lc "cd ${repository_clone_path} && sg docker -c 'docker compose up -d'"
