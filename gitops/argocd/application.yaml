apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analytics-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RomanKapustiak/open-data-ai-analytics.git
    path: gitops/app
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: open-data-analytics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
